services:
  board:
    build: .
    container_name: who-knows
    ports:
      - "18765:8765"
    environment:
      WHO_KNOWS_DATA: /data/catalog.json
      WHO_KNOWS_PORT: "8765"
      WHO_KNOWS_REFRESH: "1800"
      HTTP_PROXY: ${HTTP_PROXY:-}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      http_proxy: ${HTTP_PROXY:-}
      https_proxy: ${HTTPS_PROXY:-}
      NO_PROXY: localhost,127.0.0.1
      no_proxy: localhost,127.0.0.1
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:-}
      WHO_KNOWS_HOST_REPO: ${WHO_KNOWS_HOST_REPO:-}
      GITEA_TOKEN: ${GITEA_TOKEN:-}
      GITEA_MIRROR_URL: ${GITEA_MIRROR_URL:-}
    volumes:
      - board-data:/data
    restart: unless-stopped

volumes:
  board-data:
